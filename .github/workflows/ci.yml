name: MindFlow checks
# Automatic CI is temporarily paused during active development.
# Restore `on: [push, pull_request]` when the code is stable.
on: workflow_dispatch
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - working-directory: frontend
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - run: scripts/test_backend.sh
  platform-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: web}
          - {os: ubuntu-latest, target: linux}
          - {os: ubuntu-latest, target: apk}
          - {os: macos-latest, target: ios}
          - {os: macos-latest, target: macos}
          - {os: windows-latest, target: windows}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - working-directory: frontend
        shell: bash
        run: |
          flutter pub get
          if [ "${{ matrix.target }}" = ios ]; then
            flutter build ios --simulator --no-codesign
          else
            flutter build ${{ matrix.target }}
          fi
