[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/versions"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates dependency declarations, rather than ordinary defaults.
"app/routers/api.py" = ["B008"]
"app/core/security.py" = ["B008"]
